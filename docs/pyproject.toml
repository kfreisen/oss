[project]
name = "oss-docs"
version = "0"
description = "Documentation build environment. Not published."
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    # Reads package source statically via griffe, so the docs build never has to
    # install ray, polars, numpy and a compiled extension into one environment.
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv]
package = false
