site_name: oss
site_description: Five independent Python libraries, each with a committed before/after benchmark.
site_url: https://kfreisen.github.io/oss/
repo_url: https://github.com/kfreisen/oss
repo_name: kfreisen/oss
edit_uri: edit/main/docs/

docs_dir: docs

# The docs build environment lives inside docs_dir; keep it out of the built site.
exclude_docs: |
  pyproject.toml
  uv.lock
  hooks/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/slatekit/python
            - packages/washbook/src
            - packages/venuematch/src
            - packages/mcharness/src
            - packages/impliedmove/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true

# Renders committed benchmark JSON into tables at build time, so a published
# number cannot disagree with the data in the repository.
hooks:
  - docs/hooks/bench_tables.py

markdown_extensions:
  # Lets a docs page include a package README verbatim, keeping the PyPI
  # description and the docs page the same text.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - slatekit:
      - Overview: slatekit/index.md
      - Benchmarks: slatekit/benchmarks.md
      - Examples: slatekit/examples.md
      - API: slatekit/api.md
  - washbook:
      - Overview: washbook/index.md
      - Benchmarks: washbook/benchmarks.md
      - Examples: washbook/examples.md
      - API: washbook/api.md
  - venuematch:
      - Overview: venuematch/index.md
      - Benchmarks: venuematch/benchmarks.md
      - Examples: venuematch/examples.md
      - API: venuematch/api.md
  - mcharness:
      - Overview: mcharness/index.md
      - Benchmarks: mcharness/benchmarks.md
      - Examples: mcharness/examples.md
      - API: mcharness/api.md
  - impliedmove:
      - Overview: impliedmove/index.md
      - Benchmarks: impliedmove/benchmarks.md
      - Examples: impliedmove/examples.md
      - API: impliedmove/api.md
  - How benchmarks work: benchmarks.md
  - Contributing: contributing.md
