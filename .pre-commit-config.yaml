minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # One lock hook per package. They are separate because each package has its own
  # uv.lock; `files:` scopes each hook so touching one package does not re-lock the
  # other four.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.9
    hooks:
      - id: uv-lock
        name: uv-lock (slatekit)
        args: [--project, packages/slatekit]
        files: ^packages/slatekit/
      - id: uv-lock
        name: uv-lock (washbook)
        args: [--project, packages/washbook]
        files: ^packages/washbook/
      - id: uv-lock
        name: uv-lock (venuematch)
        args: [--project, packages/venuematch]
        files: ^packages/venuematch/
      - id: uv-lock
        name: uv-lock (mcharness)
        args: [--project, packages/mcharness]
        files: ^packages/mcharness/
      - id: uv-lock
        name: uv-lock (impliedmove)
        args: [--project, packages/impliedmove]
        files: ^packages/impliedmove/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      # This repo is public and the sources it was extracted from were not.
      - id: detect-private-key

  - repo: https://github.com/crate-ci/typos
    rev: v1.40.1
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: no-local-ruff-config
        name: packages must not define [tool.ruff]
        entry: python3 tools/check_no_local_ruff.py
        language: system
        files: ^packages/.*/pyproject\.toml$

      - id: no-cross-package-imports
        name: packages must not import each other
        entry: python3 tools/check_no_cross_imports.py
        language: system
        pass_filenames: false
        files: ^packages/.*\.py$

      # Catches what a YAML parser cannot: unavailable contexts, retired runner
      # labels, bad `needs` references. All three are mistakes that otherwise only
      # surface as a failed run on a pushed branch.
      - id: actionlint
        name: actionlint
        entry: uvx --from actionlint-py actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path packages/slatekit/rust/Cargo.toml --
        language: system
        types: [rust]
        files: ^packages/slatekit/rust/
