[project]
name = "mcharness"
version = "0.0.1.dev0"
description = "Reproducible batched Monte Carlo on Ray — streaming collection, per-batch seeding, and an entity-stats cache."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Freisen", email = "freise29@gmail.com" }]
keywords = ["monte-carlo", "ray", "simulation", "parallel", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = ["ray>=2.30", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/kfreisen/oss/tree/main/packages/mcharness"
Documentation = "https://kfreisen.github.io/oss/mcharness/"
Source = "https://github.com/kfreisen/oss"
Changelog = "https://github.com/kfreisen/oss/blob/main/packages/mcharness/CHANGELOG.md"
Issues = "https://github.com/kfreisen/oss/issues"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcharness"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "marimo>=0.10",
]
# psutil and the profiler drive the memory/CPU side of the benchmark, which is
# half the story for a parallelism change.
bench = ["pytest>=8.0", "pytest-benchmark>=4.0", "psutil>=5.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Ray emits DeprecationWarnings from its own dependencies that we cannot fix and
# must not be gated on; everything else is still an error.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:ray.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]
markers = ["slow: excluded from the default run"]

[tool.coverage.run]
source = ["mcharness"]
branch = true
# Ray runs work in separate processes; without this the child coverage is lost
# and the harness looks untested when it is not.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
# Lower than the rest of the repo on purpose: some Ray failure paths (worker death,
# object-store eviction) cannot be provoked deterministically in a unit test.
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ray.*"]
ignore_missing_imports = true
