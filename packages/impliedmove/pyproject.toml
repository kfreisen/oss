[project]
name = "impliedmove"
version = "0.0.1.dev0"
description = "Options-implied move, catalyst-date inference, and calibrated event probability — no dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Freisen", email = "freise29@gmail.com" }]
keywords = ["options", "implied-volatility", "black-scholes", "probability", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Intentionally empty, and part of the package's contract: everything here is
# stdlib `math`. Adding a runtime dependency is a breaking change to why anyone
# would pick this over scipy.
dependencies = []

[project.urls]
Homepage = "https://github.com/kfreisen/oss/tree/main/packages/impliedmove"
Documentation = "https://kfreisen.github.io/oss/impliedmove/"
Source = "https://github.com/kfreisen/oss"
Changelog = "https://github.com/kfreisen/oss/blob/main/packages/impliedmove/CHANGELOG.md"
Issues = "https://github.com/kfreisen/oss/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impliedmove"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "marimo>=0.10",
]
bench = ["pytest>=8.0", "pytest-benchmark>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks live outside testpaths and are named bench_*.py so a normal `pytest`
# run never picks them up; naming them here lets `pytest benchmarks/` collect them.
python_files = ["test_*.py", "bench_*.py"]
# --cov deliberately lives on the CI command line, not here. With it in addopts,
# running a single test file locally fails the coverage threshold, which teaches
# everyone to pass --no-cov and defeats the gate.
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["slow: excluded from the default run"]

[tool.coverage.run]
source = ["impliedmove"]
branch = true

[tool.coverage.report]
# 100 is reachable here and nowhere else in the repo: this package is pure
# arithmetic with no I/O, no concurrency, and no optional dependencies.
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src"]
