[project]
name = "venuematch"
version = "0.0.1.dev0"
description = "Blocked fuzzy entity resolution — match the same real-world entity across data sources without an O(n²) sweep."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Freisen", email = "freise29@gmail.com" }]
keywords = ["entity-resolution", "record-linkage", "deduplication", "fuzzy-matching", "blocking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["rapidfuzz>=3.0"]

[project.urls]
Homepage = "https://github.com/kfreisen/oss/tree/main/packages/venuematch"
Documentation = "https://kfreisen.github.io/oss/venuematch/"
Source = "https://github.com/kfreisen/oss"
Changelog = "https://github.com/kfreisen/oss/blob/main/packages/venuematch/CHANGELOG.md"
Issues = "https://github.com/kfreisen/oss/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venuematch"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "marimo>=0.10",
]
bench = ["pytest>=8.0", "pytest-benchmark>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["slow: excluded from the default run"]

[tool.coverage.run]
source = ["venuematch"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src"]
