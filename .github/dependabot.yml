version: 2

updates:
  # Action versions rot silently and are a supply-chain surface. Grouped into one
  # pull request so this is a weekly glance rather than five notifications.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /packages/slatekit/rust
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
        # pyo3 and numpy must move together — the numpy crate pins a pyo3 range,
        # and bumping either alone produces an unresolvable build.
        exclude-patterns: ['pyo3', 'numpy']

  # One entry per package, because each has its own lockfile. Patch and minor
  # updates are grouped; majors arrive separately so they get read.
  - package-ecosystem: uv
    directories:
      - /packages/slatekit
      - /packages/washbook
      - /packages/venuematch
      - /packages/mcharness
      - /packages/impliedmove
      - /docs
    schedule:
      interval: weekly
    groups:
      python-minor:
        patterns: ['*']
        update-types: [minor, patch]
