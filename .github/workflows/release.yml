name: release

# Publishes a pure-Python package to PyPI. slatekit has its own workflow because it
# ships compiled wheels across five platforms.
#
# Tag format: <package>-v<version>, e.g. washbook-v0.2.0
#
# Publishing uses PyPI Trusted Publishing: the `id-token: write` permission lets the
# job exchange a GitHub OIDC token for a short-lived PyPI credential. There is no API
# token stored anywhere. PyPI must have a publisher configured for this repository,
# this workflow filename, and the `pypi` environment — all three are matched exactly,
# and a mismatch surfaces as a 403 that does not say which field is wrong.

on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "package=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    # slatekit is handled by release-slatekit.yml.
    if: needs.meta.outputs.package != 'slatekit'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ needs.meta.outputs.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      # A tag that disagrees with pyproject.toml would publish a version nobody can
      # find in the repository. Catch it before anything is built.
      - name: tag matches project version
        env:
          EXPECTED: ${{ needs.meta.outputs.version }}
        run: |
          actual=$(uv version --short)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "tag says $EXPECTED but pyproject.toml says $actual" >&2
            exit 1
          fi

      - run: uv build

      - name: metadata is valid
        run: uvx twine check --strict dist/*

      # TestPyPI is skipped on purpose: it is a separate namespace with a different
      # dependency universe, so a successful upload there proves very little. This
      # proves the actual thing — that the built wheel installs clean and imports.
      - name: built wheel installs and imports
        env:
          PKG: ${{ needs.meta.outputs.package }}
        run: |
          uv run --no-project --isolated --python 3.12 \
            --with "$(echo dist/*.whl)" \
            python -c "import $PKG; print($PKG.__name__, $PKG.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/${{ needs.meta.outputs.package }}/dist/
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    # Protect this environment with a required reviewer in the repository settings.
    # It is the last thing standing between a mistaken tag push and a permanent,
    # unrepeatable version number on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.meta.outputs.package }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
