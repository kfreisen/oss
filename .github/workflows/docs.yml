name: docs

# Builds the site and deploys it to GitHub Pages. Pull requests are covered by the
# `docs` job in ci.yml, which runs `mkdocs build --strict` without deploying.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      # mkdocstrings reads package source statically through griffe, so the docs
      # environment never has to resolve ray, polars, numpy and a compiled
      # extension together.
      - name: build site
        run: uv run --project docs mkdocs build --strict

      # Exporting executes each notebook, so a broken example fails the deploy
      # rather than publishing a page that errors for the reader. Each package is
      # exported in its own environment; slatekit additionally needs Rust because
      # its extension is built during sync.
      - uses: dtolnay/rust-toolchain@stable

      - name: export examples
        run: |
          for pkg in slatekit washbook venuematch mcharness impliedmove; do
            ( cd "packages/$pkg" && uv sync --locked --all-extras --quiet )
            uv run --project "packages/$pkg" \
              python tools/export_examples.py "$pkg" --out "site/$pkg/examples"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
