# Repository-wide uv settings.
#
# This is a uv.toml rather than a root pyproject.toml on purpose: a root pyproject
# would make uv treat the repository as a project, and `uv run` from the root would
# then resolve against it instead of erroring usefully. The five packages under
# packages/ are the only projects here.

# Always use a uv-managed CPython, never whatever happens to be on PATH. Without
# this, a locally installed interpreter (one bundled with a vendor SDK, say) gets
# picked as the build host and the environment stops matching CI.
python-preference = "only-managed"
